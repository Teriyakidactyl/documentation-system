name: Publish skill distribution

on:
  workflow_run:
    workflows:
      - Maintain documentation organization
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Optional immutable distribution tag, for example v1.2.0
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: publish-skill-distribution
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Check out canonical source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Software dependencies
        run: python -m pip install --disable-pip-version-check -r "d. Software/requirements.txt"

      - name: Verify canonical source is organized
        shell: bash
        run: |
          python "d. Software/Navigation Crawler.py" refresh .
          if ! git diff --quiet; then
            echo "::error::main is not in refreshed canonical state; publish aborted."
            git diff
            exit 1
          fi

      - name: Build consumer projection
        id: projection
        env:
          PYTHONPATH: d. Software
          DIST: ${{ runner.temp }}/skill-distribution
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from repo_manager.automation.distribution import build_distribution

          result = build_distribution(Path("."), Path(os.environ["DIST"]))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"source_sha={result.source_revision}\n")
              output.write(f"dist={result.output_root}\n")
          PY

      - name: Publish latest
        id: publish
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.projection.outputs.source_sha }}
          DIST: ${{ steps.projection.outputs.dist }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin latest >/dev/null 2>&1; then
            git fetch origin latest:refs/remotes/origin/latest
            git switch --force-create latest refs/remotes/origin/latest
            git rm -rf . >/dev/null 2>&1 || true
          else
            git switch --orphan latest
            git rm -rf . >/dev/null 2>&1 || true
          fi

          git clean -fdx
          cp -a "$DIST/." .
          git add -A

          if git diff --cached --quiet; then
            echo "Skill Distribution is already current."
          else
            git commit -m "Publish skill distribution from $SOURCE_SHA"
            git push origin latest
          fi

          distribution_sha="$(git rev-parse HEAD)"
          echo "distribution_sha=$distribution_sha" >> "$GITHUB_OUTPUT"

      - name: Tag immutable release
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          DISTRIBUTION_SHA: ${{ steps.publish.outputs.distribution_sha }}
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must be a v-prefixed semantic version such as v1.2.0"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::tag $VERSION already exists"
            exit 1
          fi

          git tag -a "$VERSION" "$DISTRIBUTION_SHA" -m "Skill Distribution $VERSION"
          git push origin "refs/tags/$VERSION"
