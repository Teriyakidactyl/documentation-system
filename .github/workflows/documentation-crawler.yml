name: Maintain documentation organization

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-organizing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  software-surface:
    name: Software Surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Software dependencies
        run: python -m pip install --disable-pip-version-check -r "d. Software/requirements.txt"
      - name: Discover declared operations
        working-directory: d. Software
        run: |
          python - <<'PY'
          from verification.discovery import discover
          operations = discover()
          if not operations:
              raise SystemExit("No Software operations were discovered.")
          for operation in operations:
              print(f"{operation.id}: {operation.owner.file}::{operation.owner.symbol}")
          PY

  generated-contracts:
    name: Generated Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Software dependencies
        run: python -m pip install --disable-pip-version-check -r "d. Software/requirements.txt"
      - name: Run self-assembling verification
        working-directory: d. Software
        run: python -m verification

  capability-tests:
    name: Capability Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Software dependencies
        run: python -m pip install --disable-pip-version-check -r "d. Software/requirements.txt"
      - name: Run capability and shared-contract tests
        run: |
          python -m unittest discover -s "d. Software/tests" -p "test_capabilities.py"
          python -m unittest discover -s "d. Software/tests" -p "test_core_verification.py"

  automation-tests:
    name: Automation Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Software dependencies
        run: python -m pip install --disable-pip-version-check -r "d. Software/requirements.txt"
      - name: Run Organizing automation tests
        run: python -m unittest discover -s "d. Software/tests" -p "test_organizing.py"

  architecture-conformance:
    name: Architecture Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run repository structural conformance tests
        shell: bash
        run: |
          registry_tests="$(dirname "$(find . -type f -name 'test_semantic_registry.py' -print -quit)")"
          if [ -n "$registry_tests" ] && [ -d "$registry_tests" ]; then
            python -m unittest discover -s "$registry_tests" -p "test_semantic_registry.py"
          else
            echo "No semantic registry tests found."
          fi

  repository-convergence:
    name: Repository Convergence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Software dependencies
        run: python -m pip install --disable-pip-version-check -r "d. Software/requirements.txt"
      - name: Refresh organization
        run: python "d. Software/Navigation Crawler.py" refresh .
      - name: Verify idempotence
        run: |
          git diff > /tmp/organizing-first.diff
          python "d. Software/Navigation Crawler.py" refresh .
          git diff > /tmp/organizing-second.diff
          cmp /tmp/organizing-first.diff /tmp/organizing-second.diff
          git diff --check

  refresh-main:
    name: Refresh Main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    needs:
      - software-surface
      - generated-contracts
      - capability-tests
      - automation-tests
      - architecture-conformance
      - repository-convergence
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Software dependencies
        run: python -m pip install --disable-pip-version-check -r "d. Software/requirements.txt"
      - name: Refresh organization
        run: python "d. Software/Navigation Crawler.py" refresh .
      - name: Verify idempotence
        run: |
          git diff > /tmp/organizing-first.diff
          python "d. Software/Navigation Crawler.py" refresh .
          git diff > /tmp/organizing-second.diff
          cmp /tmp/organizing-first.diff /tmp/organizing-second.diff
          git diff --check
      - name: Commit derived changes
        run: |
          if git diff --quiet; then
            echo "Organizing produced no changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Refresh derived documentation state"
          git push
