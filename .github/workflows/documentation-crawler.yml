name: Compile documentation corpus

on:
  push:
    branches:
      - main
      - organizing-concepts-resolution-flow
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: documentation-crawler-main
  cancel-in-progress: false

jobs:
  compile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install crawler dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Run compiler tests
        run: python -m unittest discover -s "4 Tooling/_compiler/tests" -p "test_*.py"

      - name: Run crawler
        run: python "4 Tooling/1 🛠️ Navigation Crawler.py" .

      - name: Verify idempotence
        shell: bash
        run: |
          git diff > /tmp/crawler-first.diff
          python "4 Tooling/1 🛠️ Navigation Crawler.py" .
          git diff > /tmp/crawler-second.diff
          cmp /tmp/crawler-first.diff /tmp/crawler-second.diff
          git diff --check

      - name: Commit derived changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Crawler produced no changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Refresh derived documentation state"
          git push
