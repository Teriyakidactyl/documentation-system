name: Maintain documentation organization

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-organizing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Software dependencies
        shell: bash
        run: |
          tooling_dir="$(dirname "$(find . -type f -name 'Navigation Crawler.py' -print -quit)")"
          python -m pip install --disable-pip-version-check -r "$tooling_dir/requirements.txt"

      - name: Run Software tests
        shell: bash
        run: |
          tooling_tests="$(dirname "$(find . -type f -path '*/tests/test_organizing.py' -print -quit)")"
          registry_tests="$(dirname "$(find . -type f -name 'test_semantic_registry.py' -print -quit)")"
          python -m unittest discover -s "$tooling_tests" -p "test_*.py"
          python -m unittest discover -s "$registry_tests" -p "test_*.py"

      - name: Refresh organization
        shell: bash
        run: |
          crawler="$(find . -type f -name 'Navigation Crawler.py' -print -quit)"
          python "$crawler" refresh .

      - name: Verify idempotence
        shell: bash
        run: |
          git diff > /tmp/organizing-first.diff
          crawler="$(find . -type f -name 'Navigation Crawler.py' -print -quit)"
          python "$crawler" refresh .
          git diff > /tmp/organizing-second.diff
          cmp /tmp/organizing-first.diff /tmp/organizing-second.diff
          git diff --check

  refresh-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Check out canonical source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Software dependencies
        shell: bash
        run: |
          tooling_dir="$(dirname "$(find . -type f -name 'Navigation Crawler.py' -print -quit)")"
          python -m pip install --disable-pip-version-check -r "$tooling_dir/requirements.txt"

      - name: Refresh organization
        shell: bash
        run: |
          crawler="$(find . -type f -name 'Navigation Crawler.py' -print -quit)"
          python "$crawler" refresh .

      - name: Verify idempotence
        shell: bash
        run: |
          git diff > /tmp/organizing-first.diff
          crawler="$(find . -type f -name 'Navigation Crawler.py' -print -quit)"
          python "$crawler" refresh .
          git diff > /tmp/organizing-second.diff
          cmp /tmp/organizing-first.diff /tmp/organizing-second.diff
          git diff --check

      - name: Commit derived changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Organizing produced no changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Refresh derived documentation state"
          git push
