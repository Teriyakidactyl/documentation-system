name: Maintain documentation organization

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-organizing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  software-surface:
    name: Software Surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Software dependencies
        run: python -m pip install --disable-pip-version-check -r "d. Software/requirements.txt"
      - name: Discover public surface and enforce gap ratchet
        working-directory: d. Software
        run: python -m repo_manager.verification.runner surface

  generated-contracts:
    name: Generated Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Software dependencies
        run: python -m pip install --disable-pip-version-check -r "d. Software/requirements.txt"
      - name: Assemble and execute verification cases
        working-directory: d. Software
        run: python -m repo_manager.verification.runner generated

  capability-tests:
    name: Capability Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Software dependencies
        run: python -m pip install --disable-pip-version-check -r "d. Software/requirements.txt"
      - name: Run capability contract tests
        run: |
          python "d. Software/tests/test_capabilities.py"
          python "d. Software/tests/test_core_contracts.py"

  automation-tests:
    name: Automation Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Software dependencies
        run: python -m pip install --disable-pip-version-check -r "d. Software/requirements.txt"
      - name: Run Organizing semantic tests
        run: python "d. Software/tests/test_organizing.py"
      - name: Run Organizing CLI contract tests
        run: python "d. Software/tests/test_organizing_cli.py"
      - name: Run Distribution automation tests
        run: python "d. Software/tests/test_distribution.py"
      - name: Run Work Management automation tests
        run: python "d. Software/tests/test_work_management.py"

  architecture-conformance:
    name: Architecture Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Software dependencies
        run: python -m pip install --disable-pip-version-check -r "d. Software/requirements.txt"
      - name: Check dependency direction and verification coverage
        working-directory: d. Software
        run: python -m repo_manager.verification.runner architecture
      - name: Test verification surface
        run: python "d. Software/tests/test_verification_surface.py"
      - name: Verify Semantic Registry
        run: python "a. Document Design/a. Assemblies/a. Elements/b. Semantic Registry/test_semantic_registry.py"

  repository-convergence:
    name: Repository Convergence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Software dependencies
        run: python -m pip install --disable-pip-version-check -r "d. Software/requirements.txt"
      - name: Inspect organization
        run: python "d. Software/Navigation Crawler.py" inspect .
      - name: Lint authored Markdown changed by Work Management refactor
        shell: bash
        run: |
          files=(
            ".project/README.md"
            "a. Document Design/a. Assemblies/b. Forms/c. Records/README.md"
            "a. Document Design/a. Assemblies/b. Forms/c. Records/b. Feedback/1. 📖 Feedback.md"
            "a. Document Design/a. Assemblies/b. Forms/c. Records/b. Feedback/2. 🛠️ Record Feedback.md"
            "a. Document Design/a. Assemblies/b. Forms/c. Records/b. Feedback/README.md"
            "a. Document Design/a. Assemblies/b. Forms/c. Records/c. Issue/1. 📖 Issue.md"
            "a. Document Design/a. Assemblies/b. Forms/c. Records/c. Issue/2. 🛠️ Record An Issue.md"
            "a. Document Design/a. Assemblies/b. Forms/c. Records/c. Issue/README.md"
            "a. Document Design/a. Assemblies/b. Forms/d. Work/README.md"
            "a. Document Design/a. Assemblies/b. Forms/d. Work/a. Plan/1. 📖 Plan.md"
            "a. Document Design/a. Assemblies/b. Forms/d. Work/a. Plan/2. 🛠️ Author A Plan.md"
            "a. Document Design/a. Assemblies/b. Forms/d. Work/b. Task/1. 📖 Task.md"
            "a. Document Design/a. Assemblies/b. Forms/d. Work/b. Task/2. 🛠️ Author A Task.md"
            "a. Document Design/a. Assemblies/b. Forms/d. Work/b. Task/README.md"
            "a. Document Design/b. Document Control/2. 📖 Repository Information Storage.md"
            "f. Work Management/1. 💡 Work Management.md"
            "f. Work Management/2. 📖 Project Storage.md"
            "f. Work Management/3. 📖 Work Lifecycle.md"
            "f. Work Management/4. 🛠️ Manage Work.md"
            "f. Work Management/5. 🛠️ Set Up Work Management.md"
            "f. Work Management/e. Planning/1. 📖 Plan Model.md"
            "f. Work Management/e. Planning/2. 🛠️ Plan Work.md"
          )
          for path in "${files[@]}"; do
            python "d. Software/Markdown.py" lint "$path"
          done
      - name: Reconcile Work Management
        run: python "d. Software/Work.py" reconcile .
      - name: Refresh organization
        run: python "d. Software/Navigation Crawler.py" refresh .
      - name: Verify idempotence
        shell: bash
        run: |
          git diff > /tmp/organizing-first.diff
          python "d. Software/Work.py" reconcile .
          python "d. Software/Navigation Crawler.py" refresh .
          git diff > /tmp/organizing-second.diff
          cmp /tmp/organizing-first.diff /tmp/organizing-second.diff
          git diff --check

  refresh-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    needs:
      - software-surface
      - generated-contracts
      - capability-tests
      - automation-tests
      - architecture-conformance
      - repository-convergence
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Software dependencies
        run: python -m pip install --disable-pip-version-check -r "d. Software/requirements.txt"
      - name: Inspect organization
        run: python "d. Software/Navigation Crawler.py" inspect .
      - name: Reconcile Work Management
        run: python "d. Software/Work.py" reconcile .
      - name: Refresh organization
        run: python "d. Software/Navigation Crawler.py" refresh .
      - name: Verify idempotence
        shell: bash
        run: |
          git diff > /tmp/organizing-first.diff
          python "d. Software/Work.py" reconcile .
          python "d. Software/Navigation Crawler.py" refresh .
          git diff > /tmp/organizing-second.diff
          cmp /tmp/organizing-first.diff /tmp/organizing-second.diff
          git diff --check
      - name: Commit derived changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Organizing produced no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Refresh derived documentation state"
          git push
